<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>图片上传示例</title>
    <!-- 引入Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <h1 class="mt-5">图片上传</h1>
        <input type="file" id="image-input" multiple accept="image/*">
        <div id="image-preview"></div>
        <button type="button" class="btn btn-primary mt-3" id="upload-button">上传图片</button>
    </div>

    <!-- 引入jQuery和Bootstrap的JavaScript文件 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 当文件选择发生变化时的处理函数
        document.getElementById('image-input').addEventListener('change', function () {
            const files = this.files;
            const previewDiv = document.getElementById('image-preview');
            previewDiv.innerHTML = ''; // 清空之前的预览内容

            // 遍历选中的文件
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.classList.add('img-thumbnail', 'mr-3', 'mb-3');
                    img.style.maxWidth = '200px';
                    img.style.maxHeight = '200px';
                    previewDiv.appendChild(img);
                };

                reader.readAsDataURL(file);
            }
        });

        // 图片压缩函数
        function compressImage(file, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 800;
                        const maxHeight = 600;
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(function (blob) {
                            resolve(new File([blob], file.name, { type: file.type }));
                        }, file.type, quality);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 上传按钮点击事件处理函数
        document.getElementById('upload-button').addEventListener('click', async function () {
            const files = document.getElementById('image-input').files;
            const compressedFiles = [];

            // 遍历选中的文件，进行压缩
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const compressedFile = await compressImage(file, 0.7);
                compressedFiles.push(compressedFile);
            }

            const formData = new FormData();
            compressedFiles.forEach((file) => {
                formData.append('images', file);
            });

            // 发送AJAX请求到后端
            $.ajax({
                url: '/upload',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function (response) {
                    console.log('图片上传成功：', response);
                },
                error: function (error) {
                    console.log('图片上传失败：', error);
                }
            });
        });
    </script>
</body>

</html>
